<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><rect width="1440" height="760" fill="#f7f4ee"/><text x="70" y="100" fill="#25232b" font-family="Georgia" font-size="66">Seis formas de llegar a tiempo.</text><g font-family="Arial" font-size="25" font-weight="700" fill="#25232b"><rect x="70" y="185" width="390" height="210" rx="24" fill="#d7f2a1"/><text x="102" y="250">01 / RADAR</text><text x="102" y="337" font-family="Georgia" font-size="52">Con contexto.</text><rect x="525" y="185" width="390" height="210" rx="24" fill="#e6ddfa"/><text x="557" y="250">02 / AULA</text><text x="557" y="337" font-family="Georgia" font-size="52">Sin agobio.</text><rect x="980" y="185" width="390" height="210" rx="24" fill="#25232b"/><text x="1012" y="250" fill="white">03 / ENTRENA</text><text x="1012" y="337" font-family="Georgia" font-size="52" fill="white">Con intención.</text><rect x="70" y="450" width="390" height="210" rx="24" fill="#ffd9b8"/><text x="102" y="515">04 / IDIOMA</text><text x="102" y="602" font-family="Georgia" font-size="52">En marcha.</text><rect x="525" y="450" width="390" height="210" rx="24" fill="#cce9e8"/><text x="557" y="515">05 / EQUIPO</text><text x="557" y="602" font-family="Georgia" font-size="52">Al día.</text><rect x="980" y="450" width="390" height="210" rx="24" fill="#efe7db"/><text x="1012" y="515">06 / PAUSA</text><text x="1012" y="602" font-family="Georgia" font-size="52">Para volver.</text></g></svg>
